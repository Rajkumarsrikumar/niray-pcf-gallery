# Runs the gallery (niraypcfgallery.com) on the Hostinger VPS as its own Docker project ("niray-pcf-gallery").
# The reverse proxy / TLS labels are added when it is wired to the VPS's existing Traefik.
services:
  web:
    build: .
    image: niray-pcf-gallery:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:3000"
